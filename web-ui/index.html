<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2d">
  <title>FleetFlow | Operations workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="FleetFlow home">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>fleet<span>flow</span></strong><small>OPERATIONS SUITE</small></span>
      </a>

      <div class="workspace-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="overview"><span class="nav-icon">▦</span><span>Overview</span></button>
        <button class="nav-link" data-page="fleet"><span class="nav-icon">▰</span><span>Fleet</span><span class="nav-count" id="fleetNavCount">1</span></button>
        <button class="nav-link" data-page="rentals"><span class="nav-icon">▣</span><span>Rentals</span></button>
        <button class="nav-link" data-page="customers"><span class="nav-icon">♙</span><span>Customers</span></button>
        <button class="nav-link" data-page="payments"><span class="nav-icon">◈</span><span>Payments</span></button>
        <button class="nav-link" data-page="maintenance"><span class="nav-icon">⚒</span><span>Maintenance</span></button>
      </nav>

      <div class="workspace-label reports-label">INSIGHTS</div>
      <nav class="primary-nav" aria-label="Insights navigation">
        <button class="nav-link" data-page="reports"><span class="nav-icon">▥</span><span>Reports</span></button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-help">
        <div class="help-orb">?</div>
        <strong>Need a hand?</strong>
        <p>Explore the workspace and manage your fleet from one place.</p>
        <button class="help-link" data-action="help">View quick guide <span>↗</span></button>
      </div>
      <div class="sidebar-profile">
        <div class="avatar avatar-indigo">AS</div>
        <div class="profile-copy"><strong>Aditya Suryan</strong><small>Workspace admin</small></div>
        <button class="more-button" aria-label="Profile menu">···</button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="breadcrumbCurrent">Overview</strong></div>
        <div class="topbar-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search anything..." autocomplete="off"><kbd>Ctrl K</kbd></label>
          <span class="environment-pill"><i></i> UI PREVIEW</span>
          <button class="icon-button" aria-label="Notifications" data-action="notifications">♧<span class="notification-dot"></span></button>
          <div class="top-avatar">AS</div>
        </div>
      </header>

      <main class="content" id="mainView" tabindex="-1"></main>
      <footer class="app-footer"><span>© 2026 FleetFlow</span><span><i class="footer-dot"></i> Local preview · Browser-only data</span></footer>
    </div>
  </div>

  <div class="mobile-overlay" id="mobileOverlay"></div>
  <dialog class="modal" id="appModal" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-heading"><div><span class="eyebrow" id="modalEyebrow">WORKSPACE ACTION</span><h2 id="modalTitle">New record</h2></div><button class="modal-close" type="button" aria-label="Close dialog" data-close-modal>×</button></div>
      <div id="modalBody"></div>
    </div>
  </dialog>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
